<body class="text-slate-800" data-build="7.0.0">
<main class="min-h-screen">
  <div class="ui-page">
    <header class="ui-page-header">
      <div><p class="ui-kicker">Contrôle des accès</p><h2 class="ui-page-title">Utilisateurs et permissions</h2><p class="ui-page-subtitle">Gérez les comptes, les statuts et les autorisations détaillées de chaque collaborateur.</p></div>
      <button id="addUserBtn" class="ui-btn ui-btn-primary"><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span> Nouvel utilisateur</button>
    </header>

    <section id="adminStats" class="ui-grid-stats"></section>

    <section class="ui-panel mt-5">
      <header class="ui-panel-header admin-table-toolbar">
        <div><p class="ui-kicker">Répertoire</p><h3 class="ui-panel-title mt-1">Comptes utilisateurs</h3><p class="ui-panel-text">Le compte propriétaire reste protégé.</p></div>
        <div class="admin-filters">
          <input id="adminSearch" class="ui-input" placeholder="Rechercher un nom, matricule…">
          <select id="adminRoleFilter" class="ui-select"><option value="">Tous les rôles</option><option value="admin">Administrateurs</option><option value="user">Utilisateurs</option></select>
          <select id="adminStatusFilter" class="ui-select"><option value="">Tous les statuts</option><option value="active">Actifs</option><option value="disabled">Désactivés</option></select>
        </div>
      </header>
      <div class="ui-table-wrap"><table class="ui-table"><thead><tr><th>Utilisateur</th><th>Matricule</th><th>Rôle</th><th>Statut</th><th>Dernière connexion</th><th>Actions</th></tr></thead><tbody id="usersBody"><tr><td colspan="6"><div class="ui-empty"><p>Chargement…</p></div></td></tr></tbody></table></div>
    </section>
  </div>
</main>
</body>
