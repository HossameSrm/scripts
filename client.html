  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <link rel="stylesheet" href="resources/css/app.css?v=8.0.0">

  <script src="resources/js/Core/Namespace.js?v=8.0.0" defer></script>
  <script src="resources/js/app.js?v=8.0.0" defer></script>
  <script src="config/app.js?v=8.0.0" defer></script>
  <script src="resources/js/Core/EventBus.js?v=8.0.0" defer></script>
  <script src="routes/web.js?v=8.0.0" defer></script>
  <script src="resources/js/Core/Router.js?v=8.0.0" defer></script>
  <script src="resources/js/Core/SessionStore.js?v=8.0.0" defer></script>
  <script src="resources/js/Components/UI.js?v=8.0.0" defer></script>
  <script src="app/Models/DatabaseModel.js?v=8.0.0" defer></script>
  <script src="app/Models/AppModel.js?v=8.0.0" defer></script>
  <script src="app/Models/DocumentModel.js?v=8.0.0" defer></script>
  <script src="resources/js/Components/Navigation/SidebarItem.js?v=8.0.0" defer></script>
  <script src="resources/js/Components/Navigation/SidebarGroup.js?v=8.0.0" defer></script>
  <script src="resources/js/Components/Navigation/AppSidebar.js?v=8.0.0" defer></script>
  <script src="resources/js/Components/Layout/AppHeader.js?v=8.0.0" defer></script>
  <script src="resources/js/Layouts/AppLayout.js?v=8.0.0" defer></script>
  <script src="app/Http/Controllers/LayoutController.js?v=8.0.0" defer></script>
  <script src="resources/js/Layouts/bootstrap.js?v=8.0.0" defer></script>
  <script src="app/Models/ClientModel.js?v=8.0.0" defer></script>
  <script src="resources/js/Pages/Clients/Index.js?v=8.0.0" defer></script>
  <script src="app/Http/Controllers/ClientsController.js?v=8.0.0" defer></script>
  <script src="resources/js/Pages/Clients/bootstrap.js?v=8.0.0" defer></script>
</head>
<body class="text-slate-800" data-build="8.0.0">
<main class="min-h-screen">
  <div id="clientsRoot" class="ui-page opacity-0 transition-opacity">
    <section class="metronic-page-heading">
      <div>
        <p class="metronic-breadcrumb">Référentiel <span>/</span> Clients</p>
        <h2>Gestion des clients</h2>
        <p>Créez un dossier client complet et gérez ses contrats et arriérés depuis une seule page.</p>
      </div>
      <button id="newClientBtn" class="ui-btn ui-btn-primary"><span>＋</span> Nouveau client</button>
    </section>

    <section class="clients-layout">
      <aside class="clients-directory ui-panel">
        <header class="clients-directory-head">
          <div><h3>Répertoire clients</h3><p>Recherchez et sélectionnez un dossier.</p></div>
          <span class="clients-directory-indicator"></span>
        </header>
        <div class="clients-directory-tools">
          <div class="metronic-search-field"><span>⌕</span><input id="clientSearch" placeholder="Rechercher un client..."></div>
          <select id="clientStatusFilter" class="ui-select ui-select-compact"><option value="">Tous</option><option value="active">Actifs</option><option value="inactive">Inactifs</option></select>
        </div>
        <div id="clientsList" class="clients-list"></div>
      </aside>
      <section id="clientEditor" class="client-editor-host"></section>
    </section>
  </div>
</main>
</body>
</html>
